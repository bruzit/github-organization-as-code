---
name: Terraform Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Terraform Test (${{ matrix.terraform }})
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        terraform: ['~1.15', '~1.16']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
      - name: Terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false
      - name: Terraform test
        run: terraform -chdir=terraform test
      - name: Terraform init repository module
        run: terraform -chdir=terraform/modules/repository init -backend=false
      - name: Terraform test repository module
        run: terraform -chdir=terraform/modules/repository test
      - name: Terraform init environment module
        run: terraform -chdir=terraform/modules/environment init -backend=false
      - name: Terraform test environment module
        run: terraform -chdir=terraform/modules/environment test

  required:
    name: Required (Terraform Test)
    needs: test
    if: always()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
