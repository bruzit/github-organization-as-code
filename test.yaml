---
organization:
  environments:
    release:
      deployment_branches:
        - ~DEFAULT_BRANCH
  rulesets:
    default-branch:
      bypass_apps:
        - 3144447 # bruzit-github-contents
repositories:
  - name: .github
    description: "BruzIT Test organization profile and the declarative YAML definition of its repositories, reconciled into GitHub by GitHub Organization as Code."
    topics:
      - github-organization
      - organization-profile
      - github-profile
      - github-profile-readme
      - gitops
      - configuration-as-code
      - declarative-configuration
      - iac
      - terraform
      - yaml
    environments:
      production:
        deployment_branches:
          - ~DEFAULT_BRANCH
  - name: template
    description: "Standardized repository scaffold for BruzIT projects. Pre-configured with semantic-release, license boilerplate, README structure, and initial v0.0.0 tag."
    topics:
      - repository-template
    is_template: true
  - name: template-use
    template:
      owner: bruzit-test
      repository: template
    environments:
      release: ~
