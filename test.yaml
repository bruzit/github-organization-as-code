---
organization:
  members:
    admins:
      - bruzina
  environments:
    release:
      deployment_branches:
        - ~DEFAULT_BRANCH
  rulesets:
    default-branch:
      bypass_apps:
        - 3144447 # bruzit-github-contents
    release-tags:
      target: tag
repositories:
  - name: .github
    visibility: public
    description: "BruzIT Test organization profile and the declarative YAML definition of its repositories, reconciled into GitHub by GitHub Organization as Code."
    topics:
      - github-organization
      - organization-profile
      - github-profile
      - github-profile-readme
      - gitops
      - configuration-as-code
      - declarative-configuration
      - iac
      - terraform
      - yaml
    environments:
      production:
        deployment_branches:
          - ~DEFAULT_BRANCH
        variables:
          EXAMPLE: example
        secrets:
          - EXAMPLE_SECRET
  - name: template
    visibility: public
    description: "Repository template for BruzIT projects: MegaLinter and semantic-release callers, release configuration, license and README skeleton."
    topics:
      - repository-template
    is_template: true
    required_checks:
      - Required (MegaLinter)
  - name: template-use
    visibility: public
    description: "Test repository created from a template by BruzIT GitHub Organization as Code."
    template:
      owner: bruzit-test
      repository: template
    environments:
      release: ~
