---
organization:
  rulesets:
    default-branch:
      bypass_apps:
        - 3144447
    other: {}
repositories:
  - name: inherit
    visibility: public
    required_checks:
      - Required (MegaLinter)
  - name: override
    visibility: public
    rulesets:
      default-branch: {}
  - name: opt-out
    visibility: public
    rulesets:
      default-branch: ~
  - name: repository-only
    visibility: public
    rulesets:
      extra:
        bypass_apps:
          - 42
