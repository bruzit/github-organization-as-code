---
organization:
  environments:
    release:
      deployment_branches:
        - ~DEFAULT_BRANCH
      variables:
        APP_ID: 3144447
      secrets:
        - APP_PEM_FILE
    staging: {}
repositories:
  - name: inherit
  - name: override
    environments:
      release: {}
  - name: opt-out
    environments:
      release: ~
  - name: repository-only
    environments:
      production:
        deployment_branches:
          - ~DEFAULT_BRANCH
