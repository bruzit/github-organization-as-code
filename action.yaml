---
name: GitHub Organization as Code
description: Apply a GitHub organization YAML configuration with Terraform, authenticated by a GitHub App.
inputs:
  path:
    required: true
    description: Organization configuration YAML, relative to the workspace.
  owner:
    required: true
    description: GitHub organization to manage, also the Terraform workspace.
  app-id:
    required: true
    description: GitHub App ID.
  app-installation-id:
    required: true
    description: GitHub App installation ID.
  app-pem-file:
    required: true
    description: GitHub App private key (PEM file content).
  aws-access-key-id:
    required: true
    description: S3 access key ID.
  aws-secret-access-key:
    required: true
    description: S3 secret access key.
  aws-bucket:
    required: true
    description: S3 bucket name for Terraform state.
  aws-endpoint-url-s3:
    required: true
    description: S3 endpoint URL.
  mode:
    required: false
    default: apply
    description: apply or plan.
runs:
  using: composite
  steps:
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false
    - name: Terraform fmt
      shell: bash
      run: terraform -chdir="$GITHUB_ACTION_PATH/terraform" fmt -check
    - name: Terraform init
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_BUCKET: ${{ inputs.aws-bucket }}
        AWS_ENDPOINT_URL_S3: ${{ inputs.aws-endpoint-url-s3 }}
        TF_WORKSPACE: ${{ inputs.owner }}
        TF_IN_AUTOMATION: true
      run: terraform -chdir="$GITHUB_ACTION_PATH/terraform" init -input=false -backend-config="bucket=$AWS_BUCKET"
    - name: Terraform validate
      shell: bash
      env:
        GITHUB_APP_ID: ${{ inputs.app-id }}
        GITHUB_APP_INSTALLATION_ID: ${{ inputs.app-installation-id }}
        GITHUB_APP_PEM_FILE: |
          ${{ inputs.app-pem-file }}
        TF_WORKSPACE: ${{ inputs.owner }}
        TF_IN_AUTOMATION: true
      run: terraform -chdir="$GITHUB_ACTION_PATH/terraform" validate
    - name: Terraform ${{ inputs.mode }}
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        CONFIG_PATH: ${{ inputs.path }}
        GITHUB_OWNER: ${{ inputs.owner }}
        GITHUB_APP_ID: ${{ inputs.app-id }}
        GITHUB_APP_INSTALLATION_ID: ${{ inputs.app-installation-id }}
        GITHUB_APP_PEM_FILE: |
          ${{ inputs.app-pem-file }}
        AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        AWS_ENDPOINT_URL_S3: ${{ inputs.aws-endpoint-url-s3 }}
        TF_WORKSPACE: ${{ inputs.owner }}
        TF_IN_AUTOMATION: true
      run: |
        case "$MODE" in
          apply) args=(apply -auto-approve) ;;
          # Read-only App can't see merge settings or bypass actors
          plan) args=(plan -lock=false -refresh=false -out="$RUNNER_TEMP/tfplan") ;;
          *) echo "::error::mode must be apply or plan, got: $MODE"; exit 1 ;;
        esac
        TF_VAR_config="$GITHUB_WORKSPACE/$CONFIG_PATH" terraform -chdir="$GITHUB_ACTION_PATH/terraform" "${args[@]}" -input=false
        [[ "$MODE" == plan ]] || exit 0
        out="$RUNNER_TEMP/tfplan.txt"
        terraform -chdir="$GITHUB_ACTION_PATH/terraform" show -no-color "$RUNNER_TEMP/tfplan" > "$out"
        {
          echo "## Terraform plan ($GITHUB_OWNER)"
          grep -m1 -E '^(Plan:|No changes\.)' "$out" || true
          echo '```text'
          size=$(wc -c < "$out")
          head -c 1000000 "$out"
          ((size <= 1000000)) || echo
          echo '```'
          ((size <= 1000000)) || echo '_Plan truncated to 1 MB, see the job log._'
        } >> "$GITHUB_STEP_SUMMARY"
